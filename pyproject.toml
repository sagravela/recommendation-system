[project]
name = "recommendation-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.2.0",
    "apache-airflow>=2.10.5",
    "apache-airflow-providers-common-sql>=1.26.0",
    "apache-airflow-providers-mysql>=6.2.2",
    "cryptography>=44.0.2",
    "fastapi>=0.115.12",
    "gradio>=5.29.1",
    "imbalancedlearningregression>=0.0.2",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "matplotlib>=3.10.1",
    "mysql-connector-python>=9.3.0",
    "mysqlclient>=2.2.7",
    "nbformat>=5.10.4",
    "numpy>=1.26.4",
    "optuna>=4.3.0",
    "plotly>=6.0.1",
    "pyarrow>=20.0.0",
    "pydantic>=2.11.3",
    "rec-engine",
    "rich>=13.9.4",
    "seaborn>=0.13.2",
    "tensorboard>=2.15.2",
    "tensorboard-plugin-profile>=2.20.2",
    "tensorflow-probability==0.23.0",
    "tensorflow-recommenders==0.7.3",
    "tensorflow[and-cuda]==2.15.1",
    "uvicorn>=0.34.2",
    "wordcloud>=1.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_ecommerce"]

[tool.uv.workspace]
members = [
    "src/rec_engine",
]

[tool.uv.sources]
rec-engine = { workspace = true }
